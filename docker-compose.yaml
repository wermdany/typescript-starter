services:
  db:
    image: postgres:17-alpine
    container_name: learn_nest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learn_nest
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - learn-nest:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learn_nest"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  learn-nest:
    name: learn-nest
